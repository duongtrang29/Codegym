<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Bảng trong CSS</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 25px;
            background-color: #f8fafc;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        /* Định kiểu bảng tổng hợp các thuộc tính theo bài học */
        table {
            width: 100%;                  /* Chiều rộng chiếm toàn bộ khung chứa */
            border-collapse: collapse;    /* Gộp đường viền liền kề thành 1 viền đơn */
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        table, th, td {
            border: 1px solid #333333;   /* Đường viền nét liền 1px màu đen */
        }

        th {
            height: 50px;                 /* Chiều cao hàng tiêu đề tối thiểu 50px */
            background-color: #333333;    /* Màu nền tối */
            color: white;                 /* Màu chữ trắng */
            text-align: left;             /* Căn chỉnh nội dung tiêu đề về bên trái */
            padding: 15px;                /* Khoảng đệm bên trong ô */
        }

        td {
            padding: 15px;                /* Khoảng cách giữa chữ và viền ô */
            background-color: #f2f2f2;    /* Nền xám nhạt */
            color: #333333;               /* Màu chữ tối */
            vertical-align: middle;       /* Căn chỉnh nội dung theo chiều dọc */
        }

        /* Hiệu ứng khi rê chuột qua từng hàng */
        tr:hover td {
            background-color: #e6e6e6;
        }
    </style>
</head>
<body>

    <h2>Danh Sách Học Viên Lớp Web</h2>

    <table>
        <thead>
            <tr>
                <th>Họ tên</th>
                <th>Tuổi</th>
                <th>Lớp</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Nguyễn Văn A</td>
                <td>20</td>
                <td>Web</td>
            </tr>
            <tr>
                <td>Trần Thị B</td>
                <td>21</td>
                <td>Web</td>
            </tr>
            <tr>
                <td>Lê Văn C</td>
                <td>22</td>
                <td>Web</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
