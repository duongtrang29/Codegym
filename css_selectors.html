<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <!-- Liên kết trực tiếp tới file css_selectors.css -->
    <link rel="stylesheet" href="css_selectors.css">
</head>
<body>

    <!-- Tiêu đề h1 căn giữa -->
    <h1>Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân -->
    <p id="bio-description">
        Xin chào! Tôi là một học viên lập trình web đam mê tìm hiểu công nghệ và xây dựng các giao diện web hiện đại, thân thiện với người dùng.
    </p>

    <!-- Danh sách 3 sở thích với màu sắc khác nhau -->
    <ul>
        <li class="hobby-coding">Lập trình web</li>
        <li class="hobby-reading">Đọc sách công nghệ</li>
        <li class="hobby-gaming">Chơi game giải trí</li>
    </ul>

    <!-- Nút bấm có hiệu ứng hover -->
    <div class="button-container">
        <button type="button" class="btn-action">Nhấn vào đây</button>
    </div>

</body>
</html>
