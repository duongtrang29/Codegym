<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Tạo Form</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            padding: 20px;
            color: #333;
        }
        .form-container {
            background-color: #ffffff;
            max-width: 650px;
            margin: 0 auto 30px auto;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .inline-label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="text"],
        input[type="email"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }
        .btn-group {
            margin-top: 20px;
        }
        button, input[type="submit"], input[type="reset"] {
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-submit {
            background-color: #27ae60;
            color: white;
        }
        .btn-reset {
            background-color: #e74c3c;
            color: white;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: FORM ĐƠN GIẢN -->
    <div class="form-container">
        <h2>Phần 1: Thông tin cá nhân & Sở thích</h2>
        <form action="" method="POST">
            <div class="form-group">
                <label for="yourname">Họ và tên:</label>
                <input type="text" id="yourname" name="yourname" placeholder="Nhập họ và tên..." required />
            </div>

            <div class="form-group">
                <label for="email_p1">Email:</label>
                <input type="email" id="email_p1" name="email" placeholder="example@gmail.com" required />
            </div>

            <div class="form-group">
                <label>Sở thích:</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="reading" /> Đọc sách</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="music" /> Nghe nhạc</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="sports" /> Thể thao</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="travel" /> Du lịch</label>
            </div>

            <div class="btn-group">
                <input type="submit" class="btn-submit" value="Gửi thông tin" />
                <input type="reset" class="btn-reset" value="Nhập lại" />
            </div>
        </form>
    </div>

    <!-- PHẦN 2: FORM ĐĂNG KÝ HỌC VIÊN -->
    <div class="form-container">
        <h2>Phần 2: Đăng ký học viên</h2>
        <form action="" method="POST">
            <div class="form-group">
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập đầy đủ họ tên..." required />
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="email@domain.com" required />
            </div>

            <div class="form-group">
                <label for="phone">Số điện thoại:</label>
                <input type="text" id="phone" name="phone" placeholder="09xxxxxxxx" required />
            </div>

            <div class="form-group">
                <label for="birthday">Ngày sinh:</label>
                <input type="date" id="birthday" name="birthday" required />
            </div>

            <div class="form-group">
                <label>Giới tính:</label>
                <label class="inline-label"><input type="radio" name="gender" value="male" checked /> Nam</label>
                <label class="inline-label"><input type="radio" name="gender" value="female" /> Nữ</label>
                <label class="inline-label"><input type="radio" name="gender" value="other" /> Khác</label>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ:</label>
                <textarea id="address" name="address" rows="3" placeholder="Nhập địa chỉ cư trú..."></textarea>
            </div>

            <div class="form-group">
                <label for="course">Khóa học quan tâm:</label>
                <select id="course" name="course">
                    <option value="html_css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <div class="form-group">
                <label>Hình thức học:</label>
                <label class="inline-label"><input type="radio" name="study_type" value="online" checked /> Online</label>
                <label class="inline-label"><input type="radio" name="study_type" value="offline" /> Offline</label>
            </div>

            <div class="form-group">
                <label>Sở thích cá nhân:</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="coding" /> Viết code</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="gaming" /> Chơi game</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="travel" /> Đi phượt</label>
                <label class="inline-label"><input type="checkbox" name="hobby" value="reading" /> Đọc sách</label>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú thêm:</label>
                <textarea id="note" name="note" rows="3" placeholder="Yêu cầu hoặc mục tiêu khi học..."></textarea>
            </div>

            <div class="btn-group">
                <input type="submit" class="btn-submit" value="Đăng ký" />
                <input type="reset" class="btn-reset" value="Nhập lại" />
            </div>
        </form>
    </div>

</body>
</html>
