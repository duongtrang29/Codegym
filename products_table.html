<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 60%;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px 14px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề h1 theo đúng yêu cầu đề bài -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng chứa danh sách sản phẩm với các cột: Tên sản phẩm, Giá, Số lượng -->
    <table>
        <thead>
            <tr>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Bàn phím cơ không dây</td>
                <td>1.250.000</td>
                <td>15</td>
            </tr>
            <tr>
                <td>Chuột công thái học</td>
                <td>850.000</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Tai nghe chống ồn</td>
                <td>2.400.000</td>
                <td>8</td>
            </tr>
            <tr>
                <td>Màn hình 24 inch IPS</td>
                <td>3.190.000</td>
                <td>12</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
